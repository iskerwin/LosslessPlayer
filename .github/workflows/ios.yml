name: iOS build and tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: Force all unit tests and screenshots (required before promotion)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select tests from audited dependencies
        id: selection
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          FORCE_FULL: ${{ inputs.full }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re, subprocess, tempfile

          # Keep this fallback independent of the selector: syntax errors,
          # missing files, failed git commands and invalid output must not narrow.
          selection = {
              'only_testing': ['-only-testing:LosslessPlayerTests'],
              'screenshots': True, 'full': True,
              'reason': 'selection unavailable; conservative full suite',
          }
          try:
              command = ['python3', 'tools/select_tests.py']
              event = os.environ['EVENT_NAME']
              if event == 'pull_request' and os.environ['FORCE_FULL'] != 'true':
                  base, head = os.environ['PR_BASE_SHA'], os.environ['PR_HEAD_SHA']
              elif event == 'workflow_dispatch' and os.environ['FORCE_FULL'] != 'true':
                  # Manual development checks compare the branch to main.
                  # A dispatch on main has an empty diff and therefore runs full.
                  base, head = 'origin/main', 'HEAD'
              else:
                  base = head = None
                  command.append('--full')
              with tempfile.TemporaryDirectory() as directory:
                  if base is not None:
                      changed = subprocess.check_output([
                          'git', 'diff', '--name-only', '--no-renames', '-z', f'{base}...{head}', '--',
                      ])
                      paths = pathlib.Path(directory) / 'changed-paths'
                      paths.write_bytes(changed)
                      command.extend(['--files-from', str(paths)])
                  result = json.loads(subprocess.check_output(command, text=True))
              arguments = result['only_testing']
              assert isinstance(arguments, list) and arguments
              assert all(isinstance(arg, str) and re.fullmatch(
                  r'-only-testing:LosslessPlayerTests(?:/[A-Za-z][A-Za-z0-9_]*)?', arg
              ) for arg in arguments)
              assert type(result['screenshots']) is bool and type(result['full']) is bool
              assert isinstance(result['reason'], str)
              if result['full']:
                  assert arguments == ['-only-testing:LosslessPlayerTests']
              selection = result
          except Exception as error:
              print(f'::warning::Test selection failed ({type(error).__name__}); running full suite and screenshots')
          print(json.dumps(selection, sort_keys=True))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('only_testing=' + ' '.join(selection['only_testing']) + '\n')
              output.write('screenshots=' + str(selection['screenshots']).lower() + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('### Test selection\n\n```json\n' + json.dumps(selection, indent=2) + '\n```\n')
          PY
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Select Xcode 26
        run: |
          set -euo pipefail
          chosen=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -z "${chosen}" ]; then
            echo "Xcode 26 is not installed on this runner" >&2
            ls /Applications | grep -i Xcode || true
            exit 1
          fi
          sudo xcode-select -s "$chosen"
          xcodebuild -version
          xcodebuild -showsdks
      - name: Select an available iPhone simulator
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          data = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'devices', 'available', '--json']))
          devices = [d for runtime, items in data['devices'].items() if 'iOS-26' in runtime for d in items if 'iPhone' in d['name']]
          if not devices:
              raise SystemExit('No iPhone simulator available')
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write('SIMULATOR_ID=' + sorted(devices, key=lambda d: d['name'])[0]['udid'] + '\n')
          PY
      - name: Boot selected simulator before testing
        timeout-minutes: 8
        run: |
          xcrun simctl boot "$SIMULATOR_ID" || true
          xcrun simctl bootstatus "$SIMULATOR_ID" -b
      - name: Build and test
        timeout-minutes: 12
        env:
          ONLY_TESTING: ${{ steps.selection.outputs.only_testing }}
        run: |
          set -euo pipefail
          read -r -a test_args <<< "${ONLY_TESTING:--only-testing:LosslessPlayerTests}"
          xcodebuild test -project LosslessPlayer.xcodeproj -scheme LosslessPlayer \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            "${test_args[@]}" \
            -parallel-testing-enabled NO -maximum-concurrent-test-simulator-destinations 1 \
            -derivedDataPath build/simulator -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=-
      - name: Capture iOS 26 screenshots
        if: success() && steps.selection.outputs.screenshots != 'false'
        timeout-minutes: 12
        env:
          TEST_RUNNER_SCREENSHOT_DIR: ${{ github.workspace }}/build/screenshots
        run: |
          set -euo pipefail
          mkdir -p build/screenshots
          # Preserve screenshots for diagnosis even when an interaction test fails.
          trap 'if [ -d /tmp/lossless-screenshots ]; then cp -R /tmp/lossless-screenshots/. build/screenshots/; fi' EXIT
          xcodebuild test -project LosslessPlayer.xcodeproj -scheme LosslessPlayer \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -only-testing:LosslessPlayerUITests \
            -parallel-testing-enabled NO -maximum-concurrent-test-simulator-destinations 1 \
            -derivedDataPath build/simulator -resultBundlePath build/UIResults.xcresult \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=-
          if [ -d /tmp/lossless-screenshots ]; then cp -R /tmp/lossless-screenshots/. build/screenshots/; fi
          find build/screenshots -type f -print
          test -s build/screenshots/library.png
          test -s build/screenshots/songs.png
          test -s build/screenshots/playlist.png
          test -s build/screenshots/now-playing.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-test-results
          path: |
            TestResults.xcresult
            build/UIResults.xcresult
            build/screenshots
  development-ipa:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: macos-26
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen and generate project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Select Xcode 26
        run: |
          set -euo pipefail
          chosen=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -z "${chosen}" ]; then
            echo "Xcode 26 is not installed on this runner" >&2
            ls /Applications | grep -i Xcode || true
            exit 1
          fi
          sudo xcode-select -s "$chosen"
          xcodebuild -version
          xcodebuild -showsdks | grep -E 'iphoneos|Simulator'
      - name: Build unsigned development app for physical iPhone
        run: >-
          xcodebuild build -project LosslessPlayer.xcodeproj -scheme LosslessPlayer
          -configuration Debug -sdk iphoneos -destination 'generic/platform=iOS'
          -derivedDataPath build/device CODE_SIGNING_ALLOWED=NO
          CURRENT_PROJECT_VERSION=${{ github.run_number }}
      - name: Package and validate IPA
        run: |
          set -euo pipefail
          mkdir -p build/ipa/Payload
          cp -R build/device/Build/Products/Debug-iphoneos/LosslessPlayer.app build/ipa/Payload/
          python3 - <<'PY'
          import pathlib, plistlib, subprocess
          app = pathlib.Path('build/ipa/Payload/LosslessPlayer.app')
          with (app / 'Info.plist').open('rb') as f:
              info = plistlib.load(f)
          assert info['CFBundleIdentifier'] == 'com.iskerwin.LosslessPlayer'
          assert 'iPhoneOS' in info['CFBundleSupportedPlatforms']
          assert 'audio' in info['UIBackgroundModes']
          assert info['CFBundleIcons']['CFBundlePrimaryIcon']['CFBundleIconName'] == 'AppIcon'
          assert str(info['DTSDKName']).startswith('iphoneos26'), info['DTSDKName']
          assert str(info['DTXcode']).startswith('26'), info['DTXcode']
          assert info['MinimumOSVersion'] == '17.0'
          print('release SDK', info['DTSDKName'], 'Xcode', info['DTXcode'], info.get('DTXcodeBuild'))
          binary = app / info['CFBundleExecutable']
          assert binary.is_file()
          subprocess.run(['lipo', str(binary), '-verify_arch', 'arm64'], check=True)
          PY
          ditto -c -k --keepParent build/ipa/Payload build/LosslessPlayer-dev-unsigned.ipa
          unzip -t build/LosslessPlayer-dev-unsigned.ipa
          cd build
          shasum -a 256 LosslessPlayer-dev-unsigned.ipa > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: LosslessPlayer-development-IPA
          path: |
            build/LosslessPlayer-dev-unsigned.ipa
            build/SHA256SUMS.txt
          if-no-files-found: error
      - name: Publish development prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: dev-${{ github.run_number }}-${{ github.run_attempt }}
        run: |
          cat > build/release-notes.md <<'NOTES'
          Lossless 开发测试版（iOS 17+，arm64，Debug）。

          本 IPA 未经过 Apple 开发者证书签名，不能直接安装。请使用 AltStore 等工具以自己的 Apple ID 重新签名后安装。这不是 TestFlight 或 App Store 版本。

          包含原生 Liquid Glass 导航、专辑/歌手/歌单、播放队列、本地歌词、递归文件夹扫描和新图标。模拟器单元测试通过后才会生成此发布。

          定位是高音质本地播放，声音经过 iOS 系统混音。未验证真机音频设备兼容性，不保证无缝切歌或逐位输出。可用 SHA256SUMS.txt 校验下载文件。
          NOTES
          gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --prerelease \
            --title "Lossless 开发版 $RELEASE_TAG" --notes-file build/release-notes.md \
            build/LosslessPlayer-dev-unsigned.ipa build/SHA256SUMS.txt
      # Prepend the just-published build to the AltStore source so Zeus /
      # AltStore / SideStore subscribers actually see updates. The commit
      # carries [skip ci] so this push does not trigger another release run.
      - name: Update AltStore source (apps.json)
        env:
          RELEASE_TAG: dev-${{ github.run_number }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main
          python3 - <<'PY'
          import datetime, json, os, pathlib, plistlib, zipfile
          tag = os.environ["RELEASE_TAG"]
          ipa = pathlib.Path("build/LosslessPlayer-dev-unsigned.ipa")
          with zipfile.ZipFile(ipa) as archive:
              info = plistlib.loads(archive.read("Payload/LosslessPlayer.app/Info.plist"))
          source_path = pathlib.Path("apps.json")
          source = json.loads(source_path.read_text())
          app = source["apps"][0]
          previous = app["versions"][0] if app.get("versions") else {}
          entry = dict(previous)
          entry.update({
              "version": info["CFBundleShortVersionString"],
              "buildVersion": str(info["CFBundleVersion"]),
              "date": datetime.date.today().isoformat(),
              "downloadURL": f"https://github.com/iskerwin/LosslessPlayer/releases/download/{tag}/LosslessPlayer-dev-unsigned.ipa",
              "size": ipa.stat().st_size,
              "localizedDescription": f"{tag}：最新开发版（自动发布）。",
          })
          versions = [v for v in app.get("versions", []) if v.get("buildVersion") != entry["buildVersion"]]
          versions.insert(0, entry)
          app["versions"] = versions[:10]
          source_path.write_text(json.dumps(source, ensure_ascii=False, indent=2) + "\n")
          print("source now at build", entry["buildVersion"])
          PY
          git add apps.json
          if git diff --cached --quiet; then
            echo "apps.json unchanged"
          else
            git commit -m "Update AltStore source for $RELEASE_TAG [skip ci]"
            git push origin main
          fi
