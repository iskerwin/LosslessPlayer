name: iOS build and tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Select an available iPhone simulator
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          data = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'devices', 'available', '--json']))
          devices = [d for runtime, items in data['devices'].items() if 'iOS' in runtime for d in items if 'iPhone' in d['name']]
          if not devices:
              raise SystemExit('No iPhone simulator available')
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write('SIMULATOR_ID=' + devices[0]['udid'] + '\n')
          PY
      - name: Build and test
        run: >-
          xcodebuild test -project LosslessPlayer.xcodeproj -scheme LosslessPlayer
          -destination "platform=iOS Simulator,id=$SIMULATOR_ID"
          -resultBundlePath TestResults.xcresult CODE_SIGNING_ALLOWED=NO
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-test-results
          path: TestResults.xcresult
  development-ipa:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen and generate project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build unsigned development app for physical iPhone
        run: >-
          xcodebuild build -project LosslessPlayer.xcodeproj -scheme LosslessPlayer
          -configuration Debug -sdk iphoneos -destination 'generic/platform=iOS'
          -derivedDataPath build/device CODE_SIGNING_ALLOWED=NO
          CURRENT_PROJECT_VERSION=${{ github.run_number }}
      - name: Package and validate IPA
        run: |
          set -euo pipefail
          mkdir -p build/ipa/Payload
          cp -R build/device/Build/Products/Debug-iphoneos/LosslessPlayer.app build/ipa/Payload/
          python3 - <<'PY'
          import pathlib, plistlib, subprocess
          app = pathlib.Path('build/ipa/Payload/LosslessPlayer.app')
          with (app / 'Info.plist').open('rb') as f:
              info = plistlib.load(f)
          assert info['CFBundleIdentifier'] == 'com.iskerwin.LosslessPlayer'
          assert 'iPhoneOS' in info['CFBundleSupportedPlatforms']
          assert 'audio' in info['UIBackgroundModes']
          binary = app / info['CFBundleExecutable']
          assert binary.is_file()
          subprocess.run(['lipo', '-verify_arch', 'arm64', str(binary)], check=True)
          PY
          ditto -c -k --keepParent build/ipa/Payload build/LosslessPlayer-dev-unsigned.ipa
          unzip -t build/LosslessPlayer-dev-unsigned.ipa
          cd build
          shasum -a 256 LosslessPlayer-dev-unsigned.ipa > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: LosslessPlayer-development-IPA
          path: |
            build/LosslessPlayer-dev-unsigned.ipa
            build/SHA256SUMS.txt
          if-no-files-found: error
      - name: Publish development prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: dev-${{ github.run_number }}-${{ github.run_attempt }}
        run: |
          cat > build/release-notes.md <<'NOTES'
          原音开发测试版（iOS 17+，arm64，Debug）。

          本 IPA 未经过 Apple 开发者证书签名，不能直接安装。请使用 AltStore 等工具以自己的 Apple ID 重新签名后安装。这不是 TestFlight 或 App Store 版本。

          包含本地音乐导入、搜索、收藏、播放进度保存、后台和锁屏控制。模拟器单元测试通过后才会生成此发布。

          未验证真机音频设备兼容性，不保证无缝播放或 bit-perfect 输出。可用 SHA256SUMS.txt 校验下载文件。
          NOTES
          gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --prerelease \
            --title "原音开发版 $RELEASE_TAG" --notes-file build/release-notes.md \
            build/LosslessPlayer-dev-unsigned.ipa build/SHA256SUMS.txt
